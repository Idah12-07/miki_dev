[package]
name = "miki-payment"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "chrono",
    "migrate",
] }
chrono = { version = "0.4", features = ["serde"] }
# HTTP client for the BTCPay Greenfield API. rustls matches the sqlx TLS
# stack, so no OpenSSL system dependency is introduced. Only the features
# this crate uses are enabled.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# HMAC-SHA256 for BTCPay webhook signature verification. Same RustCrypto
# ecosystem as rustls; no OpenSSL dependency.
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives the router directly in handler tests.
tower = { version = "0.5", features = ["util"] }
